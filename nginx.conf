upstream django {
    server web:8000;                    #Django внутри Docker
}

server {
    listen 80;
    server_name _;

    # Статика
    location /static/ {
        alias /app/staticfiles/;
    }

    #Всё остальное Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}