services:
  # Контейнер 1: PostgreSQL
  db:
    image: postgres:16                  #готовый образ PostgreSQL
    environment:                          #переменные для PostgreSQL
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # ← данные хранятся на диске
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  # Контейнер 2: Django + Gunicorn
  web:
    build: .                              #собрать из Dockerfile
    command: gunicorn habit_tracker.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles    # статика
    env_file:
      - .env                              #переменные окружения
    environment:
      DJANGO_SETTINGS_MODULE: habit_tracker.settings.prod
    depends_on:
      db:
        condition: service_healthy                               # запускать после db
    restart: unless-stopped

  # Контейнер 3: Nginx
  nginx:
    image: nginx:latest                   # готовый образ Nginx
    ports:
      - "80:80"                           #порт 80 на сервере
      - "443:443"                         #порт 443 на сервере
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # ← конфиг
      - static_volume:/app/staticfiles    # статика
      - /var/www/certbot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web                               # запускать после web
    restart: unless-stopped

volumes:
  # Тома (постоянное хранилище)
  postgres_data:
  static_volume:
